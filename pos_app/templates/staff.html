{% extends "base.html" %}{% block title %}พนักงาน{% endblock %}{% block content %}<div class="page-heading"><div><h1>พนักงาน</h1></div></div><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="form-grid"><label>ชื่อพนักงาน<input name="display_name" required></label><label>PIN ชั่วคราว<input name="pin" inputmode="numeric" maxlength="6" required></label><label>บทบาท<select name="role_id">{% for r in roles %}<option value="{{r.id}}">{{r.name_th}}</option>{% endfor %}</select></label></div><button class="primary-button">เพิ่มพนักงาน</button></form><div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>บทบาท</th><th>สถานะ</th><th></th></tr></thead><tbody>{% for s in staff_rows %}<tr><td>{{s.display_name}}</td><td>{{s.role_name}}</td><td>{{'ใช้งาน' if s.is_active else 'ปิดใช้งาน'}}</td><td><form method="post" action="{{url_for('admin.toggle_staff',staff_id=s.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="small-button">{{'ปิดใช้งาน' if s.is_active else 'เปิดใช้งาน'}}</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
