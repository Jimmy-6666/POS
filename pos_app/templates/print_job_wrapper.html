<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Receipt Print Job</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    @media print { html, body, iframe { height: auto; overflow: visible; } }
  </style>
</head>
<body>
<iframe id="printDocument" title="เอกสารสำหรับพิมพ์" src="{{document_url}}"></iframe>
<script>
(() => {
  const token = {{token|tojson}};
  const desktopUser = {{desktop_user|tojson}};
  const jobId = {{job_id|tojson}};
  const ackUrl = {{ack_url|tojson}};
  const agentUrl = {{agent_url|tojson}};
  const frame = document.querySelector('#printDocument');
  let completed = false;

  function requestUrl(path) {
    return `${path}?token=${encodeURIComponent(token)}&desktop_user=${encodeURIComponent(desktopUser)}`;
  }

  function logEvent(event) {
    return fetch(requestUrl('/print-agent/event'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({event, job_id: jobId}),
      keepalive: true,
    }).catch(() => undefined);
  }

  async function finishPrint() {
    if (completed) return;
    completed = true;
    await logEvent('browser_afterprint');
    const response = await fetch(requestUrl(ackUrl), {method: 'POST', keepalive: true}).catch(() => null);
    if (!response?.ok) await logEvent('browser_ack_failed');
    window.location.replace(requestUrl(agentUrl));
  }

  frame.addEventListener('load', () => {
    logEvent('browser_job_loaded');
    setTimeout(() => window.print(), 250);
  });
  addEventListener('afterprint', finishPrint);
})();
</script>
</body>
</html>
