{% extends "base.html" %}{% block title %}ผู้จำหน่าย{% endblock %}{% block content %}<div class="page-heading"><div><h1>ผู้จำหน่าย</h1></div></div><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="form-grid"><label>ชื่อผู้จำหน่าย<input name="name" required></label><label>ผู้ติดต่อ<input name="contact_name"></label><label>โทรศัพท์<input name="phone"></label><label>LINE<input name="line_id"></label><label>ที่อยู่<input name="address"></label><label>เลขประจำตัวผู้เสียภาษี<input name="tax_id"></label><label>หมายเหตุ<input name="note"></label></div><button class="primary-button">เพิ่มผู้จำหน่าย</button></form><div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>ผู้ติดต่อ</th><th>โทรศัพท์</th><th>LINE</th><th>สถานะ</th></tr></thead><tbody>{% for s in suppliers %}<tr><td>{{s.name}}</td><td>{{s.contact_name or '-'}}</td><td>{{s.phone or '-'}}</td><td>{{s.line_id or '-'}}</td><td>{{'ใช้งาน' if s.is_active else 'ปิด'}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
