<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>Receipt Print Agent</title></head>
<body>
<p id="status">พร้อมพิมพ์ใบเสร็จ</p>
<script>
(() => {
  const token = {{token|tojson}};
  const desktopUser = {{desktop_user|tojson}};
  const status = document.querySelector('#status');

  function requestUrl(path) {
    return `${path}?token=${encodeURIComponent(token)}&desktop_user=${encodeURIComponent(desktopUser)}`;
  }

  function logEvent(event, details = {}) {
    return fetch(requestUrl('/print-agent/event'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({event, ...details}),
    }).catch(() => undefined);
  }

  async function poll() {
    try {
      const response = await fetch(requestUrl('/print-agent/next'), {cache: 'no-store'});
      const data = await response.json();
      if (!data.job) return setTimeout(poll, 800);
      status.textContent = 'กำลังพิมพ์เอกสาร';
      await logEvent('browser_print_requested', {job_id: data.job.id, document_type: data.job.document_type});
      window.location.replace(requestUrl(data.job.render_url));
    } catch (_) {
      setTimeout(poll, 1500);
    }
  }

  poll();
})();
</script>
</body>
</html>
